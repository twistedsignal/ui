# Generated by `lest init`.
# Suites group spec files and pin them to the backend they need;
# run everything with `lest`, one suite with `lest run <name>`.

[suites.unit]
include = [
    "src/ui/testing/**/*.spec.luau",
    "src/ui/motion/Easing.spec.luau",
    "src/ui/motion/AccelTweenObject.spec.luau",
]

[suites.roblox]
include = [
    "src/ui/reactive/**/*.spec.luau",
    "src/ui/binding/**/*.spec.luau",
    "src/ui/motion/Motion.spec.luau",
    "src/ui/animation/**/*.spec.luau",
]
backend = "studio"
default = false

[settings]
backend = "native" # default for suites that don't declare one
timeout_ms = 5000
# The framework ships inside the lest binary and is written to .lest/core.
# Set `core = "path/to/core/src"` only to point at your own copy instead.
