name: Release Roblox model

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        default: v0.2.1

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check version
        shell: bash
        run: |
          package_version="$(awk -F '"' '/^version = / { print $2; exit }' pesde.toml)"
          if [[ "v${package_version}" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match pesde.toml version ${package_version}." >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"

      - name: Set up Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.1.1

      - name: Install pinned tools
        run: rokit install --no-trust-check

      - name: Install package dependencies
        run: pesde install --locked

      - name: Build Roblox model
        run: rojo build release.project.json --output ui-${PACKAGE_VERSION}.rbxm

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${RELEASE_TAG}"
          "ui-${PACKAGE_VERSION}.rbxm"
          --verify-tag
          --title "${RELEASE_TAG}"
          --generate-notes
