[package]
name = "twistedsignal/ui"
version = "0.2.1"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = [
    "CONTRIBUTING.md",
    "PROMPT.md",
    "lest.toml",
    "rokit.toml",
    "package.json",
    "package-lock.json",
    "moonwave.toml",
    "docs",
    "dev.project.json",
    "release.project.json",
    "node_modules",
    "build",
    "Packages",
    "src/Rx.luau",
    "src/ui/**/*.spec.luau",
    "src/ui/animation/**",
    "src/ui/testing/**",
    "src/ui/motion/AccelTween.luau",
    "src/ui/motion/AccelTweenObject.luau",
]

[dependencies]
Rx = "nightcycle/rx@3.7.3"
